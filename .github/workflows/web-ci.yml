name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/mcp/**"
      - "packages/**"
      - "supabase/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/mcp/**"
      - "packages/**"
      - "supabase/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (core)
        run: pnpm --filter @storylane/core exec tsc --noEmit

      - name: Test (core)
        run: pnpm --filter @storylane/core run test

      - name: Type check (web)
        run: pnpm --filter web exec tsc --noEmit

      - name: Type check (mcp)
        run: pnpm --filter mcp exec tsc --noEmit

      - name: Lint (web)
        run: pnpm --filter web run lint

      # Pinned, not `latest`: the CLI version picks the local stack's container
      # images, so `latest` lets an upstream release change what this job runs
      # against with no commit here. Bump deliberately.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      # Edge Functions run on Deno, not Node, so their tests need their own
      # runtime — pnpm never sees them. Pinned for the same reason the CLI is.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      # Runs before `supabase start` so a broken function fails the job in
      # seconds rather than after the stack is up. The glob only reaches
      # index.test.ts — a function whose tests live in another file needs this
      # pattern widened.
      #
      # --node-modules-dir=none makes Deno resolve `npm:` specifiers from its
      # own cache instead of the node_modules pnpm just laid out. That is how
      # these functions actually run in production (Deno runtime, no
      # node_modules), and without it the step depends on whether pnpm happened
      # to hoist @supabase/supabase-js to the root — it does locally and does
      # not on CI. It also keeps Deno from reading pnpm-workspace.yaml, which it
      # otherwise offers to migrate into package.json mid-run.
      - name: Test (edge functions)
        run: deno test --allow-env --node-modules-dir=none supabase/functions/*/index.test.ts

      # `supabase start` applies every migration to an empty database, which is
      # what proves the chain still applies in order. On a pull_request it does
      # gate the merge; on main it is a second, independent confirmation —
      # deploy.yml only fires on a published release, never on this push, so
      # there is nothing here for a slow run to lose a race against.
      # Excluded services are the ones no test touches — the integration suite
      # makes no storage or edge-function calls. Drop the `-x` if one ever does.
      - name: Start Supabase (applies all migrations to a fresh DB)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      # SUPABASE_INTEGRATION=1 un-skips the 35 *.integration.test.ts files that
      # cover RLS, RPCs and triggers — the layer tsc/eslint/jsdom cannot reach.
      # The credentials stay inside this step rather than $GITHUB_ENV: Next
      # inlines NEXT_PUBLIC_* at build time, so exporting them job-wide would
      # bake 127.0.0.1 into the Build step's bundle.
      - name: Run tests (web)
        run: |
          # Assign first: `eval "$(supabase status ...)"` would swallow a
          # status failure and leave the three vars empty, so the suite would
          # fail as "env not set" instead of naming the real cause. The :?
          # guards cover the other half — status succeeding but reporting
          # different key names, which the CLI has changed before.
          supabase_env="$(supabase status -o env)"
          eval "$supabase_env"
          : "${API_URL:?supabase status reported no API_URL}"
          : "${ANON_KEY:?supabase status reported no ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status reported no SERVICE_ROLE_KEY}"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          pnpm --filter web run test
        env:
          SUPABASE_INTEGRATION: "1"

      # Same live stack, different env var names: the MCP server reads
      # SUPABASE_URL/SUPABASE_ANON_KEY (it is not a Next app, so it has no
      # NEXT_PUBLIC_ prefix). Its integration tests exercise the agent bot
      # against real RLS, which is the layer its unit tests cannot reach.
      - name: Run tests (mcp)
        run: |
          supabase_env="$(supabase status -o env)"
          eval "$supabase_env"
          : "${API_URL:?supabase status reported no API_URL}"
          : "${ANON_KEY:?supabase status reported no ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status reported no SERVICE_ROLE_KEY}"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          pnpm --filter mcp run test
        env:
          SUPABASE_INTEGRATION: "1"

      # Type checking a Server Component doesn't catch a browser-only
      # dependency leaking into the server bundle (TASK-67 regression: an
      # @dnd-kit import in a Server-Component-imported module broke build
      # but not tsc/eslint/vitest) — build is the only gate that catches it.
      - name: Build (web)
        run: pnpm --filter web run build

      # Chromium only: this suite is one core-flow smoke test, not a
      # cross-browser matrix. --with-deps because the runner image carries no
      # guarantee about the shared libraries the browser needs.
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Runs last because it is the slowest gate — a type error or a failing
      # unit test should go red minutes before this starts.
      #
      # Playwright starts `next dev` itself (playwright.config.ts webServer),
      # NOT the production build above: /auth/login's "Continue as dev user"
      # button renders only under NODE_ENV !== "production", and it is the only
      # way in without a real OAuth provider. The seeded dev account comes from
      # supabase/seed.sql, which `supabase start` applies to the fresh stack.
      - name: Run E2E (web)
        run: |
          supabase_env="$(supabase status -o env)"
          eval "$supabase_env"
          : "${API_URL:?supabase status reported no API_URL}"
          : "${ANON_KEY:?supabase status reported no ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status reported no SERVICE_ROLE_KEY}"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          pnpm --filter web run test:e2e

      # trace: "retain-on-failure" is set in playwright.config.ts, and without
      # this the trace only ever exists inside the finished runner.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
