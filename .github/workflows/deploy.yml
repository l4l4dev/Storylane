name: Deploy

# Production consistency: migrations and Edge Functions are applied BEFORE the
# app deploy starts. Vercel's Git auto-deploy for main is disabled in
# apps/web/vercel.json, so the Deploy Hook at the end of this job is the only
# thing that puts new app code live — new code can never run against an old
# schema. See DEPLOY.md for the one-time setup.
#
# Triggered by a published GitHub Release, not a push to main: merges batch on
# main un-deployed, and publishing a release is the deliberate act that ships
# them. It also closes a race a push trigger has no way to avoid — CI (the
# "Start Supabase" job in web-ci.yml) applies the whole migration chain to a
# fresh database on every push to main too, but has no dependency on this
# workflow, so a bad migration could reach production before that check goes
# red. Nothing here fires on push, so there is nothing left for CI to lose to.

on:
  release:
    types: [published]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref iwmacbzlfeufzedjguce
          supabase db push

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy

      - name: Trigger Vercel production deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
