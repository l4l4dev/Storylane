name: Agent config parity

# Separate from web-ci.yml on purpose: this needs no pnpm install, no Docker and
# no build, so an instruction-file edit gets a seconds-long gate instead of
# dragging the full web job.

on:
  push:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".codex/agents/**"
      - ".claude/skills/**"
      - ".agents/**"
      # The symlinked instruction files themselves: a tool that replaces one
      # with a regular file touches THIS path, not the target it used to point
      # at, so watching the targets alone would miss the drift entirely.
      - "AGENTS.md"
      - "CLAUDE.md"
      - "apps/*/AGENTS.md"
      - "apps/*/CLAUDE.md"
      - "apps/*/.claude/**"
      # ...and the canonical targets, since deleting or renaming one leaves the
      # link dangling while touching no path on the link's own side.
      - ".claude/agent-memory/**"
      - "scripts/check-agent-config-parity.sh"
      - "scripts/check-agent-config-parity.test.sh"
      - ".github/workflows/agent-config-parity.yml"
  pull_request:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".codex/agents/**"
      - ".claude/skills/**"
      - ".agents/**"
      # The symlinked instruction files themselves: a tool that replaces one
      # with a regular file touches THIS path, not the target it used to point
      # at, so watching the targets alone would miss the drift entirely.
      - "AGENTS.md"
      - "CLAUDE.md"
      - "apps/*/AGENTS.md"
      - "apps/*/CLAUDE.md"
      - "apps/*/.claude/**"
      # ...and the canonical targets, since deleting or renaming one leaves the
      # link dangling while touching no path on the link's own side.
      - ".claude/agent-memory/**"
      - "scripts/check-agent-config-parity.sh"
      - "scripts/check-agent-config-parity.test.sh"
      - ".github/workflows/agent-config-parity.yml"

jobs:
  parity:
    name: .codex TOML mirrors .claude Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The extractors first: every case in here is a review finding where a
      # malformed field read back as a value that matched its counterpart, so
      # the gate below would have printed ok on an unloadable config.
      - run: ./scripts/check-agent-config-parity.test.sh

      - run: ./scripts/check-agent-config-parity.sh
