name: publish

on:
  push:
    branches: [main, rewrite/self-hosted]
    # Only semver-shaped tags publish. The pre-rewrite archive tag v0-supabase
    # has no dots and is excluded explicitly as well.
    tags: ["v[0-9]*.[0-9]*.[0-9]*", "!v0-supabase"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storylane/core test
      - run: pnpm --filter @storylane/core typecheck
      - run: pnpm --filter @storylane/server lint
      - run: pnpm --filter @storylane/server typecheck
      - run: cd apps/server && bun test
      - run: pnpm --filter @storylane/web lint
      - run: pnpm --filter @storylane/web test
      - run: pnpm --filter @storylane/web build

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/storylane
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=rewrite,enable=${{ github.ref == 'refs/heads/rewrite/self-hosted' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A Dockerfile regression must surface on the PR, not after merge: the web stage has its
  # own dependency set and the test job never exercises it.
  image-check:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
