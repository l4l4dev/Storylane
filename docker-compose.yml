services:
  app:
    image: ${STORYLANE_IMAGE:-ghcr.io/l4l4dev/storylane}:${STORYLANE_IMAGE_TAG:-edge}
    restart: unless-stopped
    environment:
      STORYLANE_PORT: "3000"
      STORYLANE_DATA_DIR: /data
      STORYLANE_BASE_URL: ${STORYLANE_BASE_URL:-}
      STORYLANE_TRUST_PROXY: ${STORYLANE_TRUST_PROXY:-false}
    volumes:
      - storylane-data:/data
    ports:
      # Loopback by default: with STORYLANE_TRUST_PROXY=true (the https profile) a client that
      # reaches this port directly could forge X-Forwarded-For and defeat the rate limiters.
      # The LAN deployment overrides it with STORYLANE_BIND=0.0.0.0 (INSTALL §3).
      - "${STORYLANE_BIND:-127.0.0.1}:${STORYLANE_HOST_PORT:-3000}:3000"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$DOMAIN" ]; then
          echo "DOMAIN is not set. Copy .env.example to .env, set DOMAIN, then retry." >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  storylane-data:
    name: storylane-data
  caddy-data:
  caddy-config:
